<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Moonist — the sky from the Moon</title>
  <meta name="description" content="Stand on the near side of the Moon and look up: the real sky, the real Earth, right now." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23b8bcc4'/%3E%3Ccircle cx='5.5' cy='6' r='1.6' fill='%23888d96'/%3E%3Ccircle cx='10' cy='10.5' r='2.2' fill='%23979ca6'/%3E%3Ccircle cx='11' cy='4.5' r='1' fill='%23888d96'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #c9cfd8;
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #app canvas.dragging { cursor: grabbing; }
    #hud { position: fixed; inset: 0; pointer-events: none; }

    /* The veil is in the document from the first paint: the scene takes a
       couple of seconds to fetch textures and build terrain, and a black
       screen with no explanation is the worst possible first impression. */
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #05070a;
      transition: opacity 600ms ease;
    }
    #boot .title { font-size: 15px; font-weight: 600; color: #e8edf4; letter-spacing: 0.01em; }
    #boot .step { font-size: 12px; color: #7d8590; min-height: 1.3em; }
    #boot .bar { width: 148px; height: 2px; background: rgba(255,255,255,0.10); border-radius: 2px; overflow: hidden; }
    #boot .bar i { display: block; width: 38%; height: 100%; background: #7fb2ea; animation: bootslide 1.15s ease-in-out infinite; }
    @keyframes bootslide { 0% { transform: translateX(-110%) } 100% { transform: translateX(330%) } }
    #boot.failed .bar { display: none; }
    #boot .retry {
      display: none; margin-top: 4px; padding: 7px 14px; cursor: pointer;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px; color: #dbe2ea; font: 500 12px/1 inherit;
    }
    #boot.failed .retry { display: block; }
    #boot .retry:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="boot">
    <div class="title">Moonist</div>
    <div class="step" id="boot-step">Getting to the Moon…</div>
    <div class="bar"><i></i></div>
    <button class="retry" id="boot-retry" type="button">Try again</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
